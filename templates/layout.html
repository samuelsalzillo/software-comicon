<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/logo.png') }}" />
  <title>Simulazione Code</title>
  <script src="{{ url_for('static', filename='js/jquery-3.6.0.min.js') }}"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Roboto", sans-serif;
    }

    body {
      background: #556959;

      min-height: 100vh;
    }

    /* The main wrapper shouldn't take up layout space itself so content won't get pushed down when menu opens */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      margin-bottom: 0;
    }

    .nav-links {
      display: none;
      flex-direction: column;
      width: 100%;
      background: #3ab1c8;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      padding-top: 60px; /* Space for the hamburger icon to sit inside the blue bar */
    }

    .nav-links.active {
      display: flex;
    }

    .nav-item {
      color: white;
      font-size: 1.2rem;
      text-decoration: none;
      padding: 1rem;
      text-align: center;
      transition: background-color 0.3s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: block;
      cursor: pointer;
    }

    .nav-item:hover,
    .nav-dropdown:hover>.nav-item {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
    }

    .nav-dropdown {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .dropdown-content {
      display: none;
      flex-direction: column;
      background-color: #2a8b9e;
    }

    .nav-dropdown.active .dropdown-content {
      display: flex;
    }

    .dropdown-content a {
      color: white;
      padding: 1rem;
      text-decoration: none;
      font-size: 1.1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      display: block;
      position: relative;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
    }

    .dropdown-content a.dinamico-1 {
      background: linear-gradient(90deg, #d3ab14 0%, #d3ab14 20%, #1F598C 80%, #1F598C 100%);
    }

    .dropdown-content a.dinamico-2 {
      background: linear-gradient(90deg, #f055d4 0%, #f055d4 20%, #ffffff 80%, #ffffff 100%);
      color: #333;
      /* Darker text since the right side is white */
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8), -1px -1px 2px rgba(0, 0, 0, 0.3);
    }

    .dropdown-content a.statico-verde {
      background: linear-gradient(90deg, #2a8b9e 0%, #3ca04d 100%);
    }

    .dropdown-content a.statico-rosso {
      background: linear-gradient(90deg, #2a8b9e 0%, #d93d3d 100%);
    }

    .dropdown-content a:hover {
      filter: brightness(1.1);
      color: white;
      text-decoration: none;
    }

    .dropdown-content a.dinamico-2:hover {
      color: #111;
    }

    .hamburger {
      display: flex;
      justify-content: flex-end;
      padding: 1rem;
      cursor: pointer;
      position: absolute;
      top: 0;
      right: 0;
      z-index: 1001; /* Ensure hamburger is always on top of the blue menu background */
    }

    .hamburger svg {
      width: 30px;
      height: 30px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      padding-top: 70px; /* Add padding to content area since navbar is absolute */
    }

    h1 {
      text-align: center;
      color: #f5a525;
      margin-bottom: 30px;
      font-size: 2.5em;
    }

    @media (min-width: 992px) {
      /* Keep hamburger visible on desktop now */

      .nav-links {
        /* Remove the forced display logic so toggle works */
        flex-direction: row;
        justify-content: center;
        align-items: center;
        padding-top: 0; /* Clear the extra top padding used for mobile hamburger */
        padding-right: 60px; /* Make sure the links do not overlap with the floating hamburger on the right */
      }

      .nav-links.active {
        display: flex;
      }

      .nav-item {
        border-bottom: none;
        padding: 1.2rem 1.5rem;
      }

      .nav-dropdown {
        position: relative;
        width: auto;
      }

      .dropdown-content {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        min-width: 240px;
        border-radius: 0 0 8px 8px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        display: none !important;
      }

      .nav-dropdown:hover .dropdown-content {
        display: flex !important;
      }

      .dropdown-content a {
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
        padding: 12px 20px;
      }

      .dropdown-content a:last-child {
        border-bottom: none;
      }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>

<body>
  <nav class="navbar">
    <div class="hamburger" id="hamburger">
      <svg>
        <path d="M3 12h18M3 6h18M3 18h18" stroke="white" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="{{ url_for('dashboard') }}" class="nav-item">Dashboard</a>

      <div class="nav-dropdown" id="dropdown-dinamico">
        <div class="nav-item dropdown-toggle">Dinamico</div>
        <div class="dropdown-content">
          <a href="{{ url_for('controls_combined') }}" class="dinamico-1">Dinamico 1 (Giallo/Blu)</a>
          <a href="{{ url_for('controls_combined2') }}" class="dinamico-2">Dinamico 2 (Rosa/Bianco)</a>
        </div>
      </div>

      <div class="nav-dropdown" id="dropdown-statiche">
        <div class="nav-item dropdown-toggle">Statiche</div>
        <div class="dropdown-content">
          <a href="{{ url_for('controls_charlie') }}" class="statico-verde">Controllo G&G (Verde)</a>
          <a href="{{ url_for('controls_statico') }}" class="statico-rosso">Controllo Statico (Rosso)</a>
        </div>
      </div>

      <div class="nav-dropdown" id="dropdown-tastierini">
        <div class="nav-item dropdown-toggle">Prove</div>
        <div class="dropdown-content">
          <a href="{{ url_for('keypad') }}">Tastierino 1</a>
          <a href="{{ url_for('keypad2') }}">Tastierino 2</a>
          <a href="{{ url_for('provaE1') }}">Prova E1</a>
          <a href="{{ url_for('provaE2') }}">Prova E2</a>
        </div>
      </div>

      <a href="{{ url_for('controls_cassa') }}" class="nav-item">Cassa</a>
      <a href="{{ url_for('scoring') }}" class="nav-item">Scoring</a>
    </div>
  </nav>

  <div class="content-wrapper" style="padding: 20px; margin-top: 60px;">{% block content %}{% endblock %}</div>
  <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

  <script>
    $(document).ready(function () {
      $("#hamburger").click(function () {
        $("#navLinks").toggleClass("active");
        
        // Se il menu è attivo, cambia il colore dell'hamburger o di elementi se necessario 
        // (il background del menu nav-links coprirà già l'area dietro l'icona)
        
        $(this).find("i").toggleClass("fa-bars fa-times");
      });

      // Enable toggle on click for mobile/tablet dropdown items
      $(".nav-dropdown .dropdown-toggle").click(function (e) {
        if ($(window).width() < 992) {
          e.preventDefault();
          $(this).parent().toggleClass("active");
        }
      });

      // Chiudi il menu quando si clicca su un vero link (non un dropdown toggle)
      $("#navLinks a:not(.dropdown-toggle)").click(function () {
        // Chiudi sempre il menu globale quando si clicca un link valido, sia mobile che desktop
        $("#navLinks").removeClass("active");
        $("#hamburger i").removeClass("fa-times").addClass("fa-bars");
      });
    });
  </script>

  {% block scripts %}{% endblock %}
</body>

</html>
